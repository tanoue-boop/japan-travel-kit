name: Update eSIM prices

on:
  schedule:
    # Daily at 03:17 UTC (12:17 JST). Off the hour to avoid the top-of-hour rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The script never exits non-zero on a provider failure: a failed fetch keeps
      # that provider's last known prices, so a bad day upstream can't break the site.
      - name: Fetch latest prices
        run: node scripts/fetch-esim-prices.mjs

      # No "[skip ci]" on purpose: the push must trigger a Vercel redeploy so the
      # new prices go live.
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/esim-prices.json; then
            echo "No price changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/esim-prices.json
          git commit -m "chore(data): refresh eSIM prices $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
